server:
  port: 8085

spring:
  application:
    name: billing-service

  datasource:
    url: jdbc:postgresql://localhost:5433/api_management_db
    username: apiuser
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    table: flyway_schema_history_billing
    baseline-on-migrate: true
    baseline-version: 0
    url: jdbc:postgresql://localhost:5433/api_management_db
    user: apiuser
    password: password

  kafka:
    bootstrap-servers: 192.168.1.116:9092
    consumer:
      group-id: billing-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.example.billingservice.event.ApiRequestEvent

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false

jwt:
  secret: ${JWT_SECRET}

billing:
  free-plan-limit: 1000
  starter-plan-limit: 10000
  pro-plan-limit: 100000
  free-plan-price: 0.0
  starter-plan-price: 29.0
  pro-plan-price: 99.0
  enterprise-plan-price: 299.0
  overage-price-per-request: 0.001

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    prometheus:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true